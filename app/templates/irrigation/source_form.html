{% extends "irrigation/layout.html" %}{% block irrigation_content %}<form class="form-card" method="post"><div class="form-grid"><label>Farm *<select name="farm_id" required><option value="">Select farm</option>{% for f in farms %}<option value="{{f.id}}" {% if selected_farm_id==f.id %}selected{% endif %}>{{f.name}}</option>{% endfor %}</select></label><label>Source name *<input name="name" required maxlength="140" value="{{source.name if source else ''}}"></label><label>Source type<select name="source_type">{% for x in source_types %}<option value="{{x}}" {% if source and source.source_type==x %}selected{% endif %}>{{x|replace('_',' ')|title}}</option>{% endfor %}</select></label><label>Capacity (litres)<input name="capacity_litres" type="number" min="0" step="0.01" value="{{source.capacity_litres or '' if source else ''}}"></label><label>Current level (litres)<input name="current_level_litres" type="number" min="0" step="0.01" value="{{source.current_level_litres or '' if source else ''}}"></label><label>Flow rate (L/min)<input name="flow_rate_lpm" type="number" min="0" step="0.01" value="{{source.flow_rate_lpm or '' if source else ''}}"></label><label>Water quality<select name="water_quality_status">{% for x in quality_statuses %}<option value="{{x}}" {% if source and source.water_quality_status==x %}selected{% endif %}>{{x|replace('_',' ')|title}}</option>{% endfor %}</select></label><label>Last quality test<input name="last_quality_test_date" type="date" value="{{source.last_quality_test_date or '' if source else ''}}"></label><label>Availability<select name="availability_status">{% for x in availability_statuses %}<option value="{{x}}" {% if source and source.availability_status==x %}selected{% endif %}>{{x|replace('_',' ')|title}}</option>{% endfor %}</select></label><label class="wide">Notes<textarea name="notes">{{source.notes or '' if source else ''}}</textarea></label><label class="check"><input type="checkbox" name="is_active" {% if not source or source.is_active %}checked{% endif %}> Active source</label></div><div class="form-actions"><a class="btn" href="/irrigation/water-sources">Cancel</a><button class="btn primary" type="submit">Save Water Source</button></div></form>{% endblock %}

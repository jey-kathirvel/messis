{% extends "irrigation/layout.html" %}{% block irrigation_content %}<form class="form-card" method="post"><div class="form-grid"><label>Farm *<select name="farm_id" required><option value="">Select farm</option>{% for f in farms %}<option value="{{f.id}}" {% if selected_farm_id==f.id %}selected{% endif %}>{{f.name}}</option>{% endfor %}</select></label><label>Zone name *<input name="name" required maxlength="140" value="{{zone.name if zone else ''}}"></label><label>Crop<input name="crop_name" value="{{zone.crop_name or '' if zone else ''}}"></label><label>Variety<input name="crop_variety" value="{{zone.crop_variety or '' if zone else ''}}"></label><label>Growth stage<input name="growth_stage" value="{{zone.growth_stage or '' if zone else ''}}"></label><label>Plant / tree count<input name="plant_count" type="number" min="0" value="{{zone.plant_count if zone else 0}}"></label><label>Area<input name="area_value" type="number" min="0" step="0.001" value="{{zone.area_value or '' if zone else ''}}"></label><label>Area unit<select name="area_unit">{% for x in area_units %}<option value="{{x}}" {% if zone and zone.area_unit==x %}selected{% endif %}>{{x|replace('_',' ')|title}}</option>{% endfor %}</select></label><label>Soil type<input name="soil_type" value="{{zone.soil_type or '' if zone else ''}}"></label><label>Irrigation method<select name="irrigation_method">{% for x in methods %}<option value="{{x}}" {% if zone and zone.irrigation_method==x %}selected{% endif %}>{{x|replace('_',' ')|title}}</option>{% endfor %}</select></label><label>Litres per plant<input name="recommended_litres_per_plant" type="number" min="0" step="0.01" value="{{zone.recommended_litres_per_plant or '' if zone else ''}}"></label><label>Interval days<input name="recommended_interval_days" type="number" min="0" value="{{zone.recommended_interval_days or '' if zone else ''}}"></label><label>Last irrigation date<input name="last_irrigation_date" type="date" value="{{zone.last_irrigation_date or '' if zone else ''}}"></label><label>Next irrigation date<input name="next_irrigation_date" type="date" value="{{zone.next_irrigation_date or '' if zone else ''}}"></label><label class="wide">Notes<textarea name="notes">{{zone.notes or '' if zone else ''}}</textarea></label><label class="check"><input type="checkbox" name="is_active" {% if not zone or zone.is_active %}checked{% endif %}> Active zone</label></div><div class="form-actions"><a class="btn" href="/irrigation/zones">Cancel</a><button class="btn primary" type="submit">Save Zone</button></div></form>{% endblock %}

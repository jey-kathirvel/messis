{% extends "irrigation/layout.html" %}{% block irrigation_content %}<section class="scheduler-head"><div><span class="eyebrow green">PRODUCT SAFETY PROFILE</span><h2>{{ 'Edit' if product else 'Add' }} fertilizer product</h2><p>Concentration is expressed in the selected product unit per 1,000 litres.</p></div><a class="btn" href="/irrigation/fertilizers">← Inventory</a></section><form class="form-card" method="post"><div class="form-grid"><label>Product name<input name="name" maxlength="180" value="{{ product.name if product else '' }}" required></label><label>Category<select name="category">{% for value in categories %}<option value="{{ value }}" {% if product and product.category==value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></label><label>Manufacturer<input name="manufacturer" value="{{ product.manufacturer if product and product.manufacturer else '' }}"></label><label>Unit<select name="unit">{% for value in units %}<option value="{{ value }}" {% if product and product.unit==value %}selected{% endif %}>{{ value }}</option>{% endfor %}</select></label>{% if not product %}<label>Opening stock<input type="number" min="0" step="0.001" name="stock_quantity" value="0"></label>{% endif %}<label>Safe concentration / 1,000 L<input type="number" min="0" step="0.001" name="safe_concentration_per_1000l" value="{{ product.safe_concentration_per_1000l if product and product.safe_concentration_per_1000l is not none else '' }}"></label><label>Expiry date<input type="date" name="expiry_date" value="{{ product.expiry_date if product and product.expiry_date else '' }}"></label><label class="check"><input type="checkbox" name="is_active" {% if not product or product.is_active %}checked{% endif %}> Active</label><label class="wide">Compatibility notes<textarea name="compatibility_notes">{{ product.compatibility_notes if product and product.compatibility_notes else '' }}</textarea></label><label class="wide">Safety instructions<textarea name="safety_instructions">{{ product.safety_instructions if product and product.safety_instructions else '' }}</textarea></label></div><div class="form-actions"><a class="btn" href="/irrigation/fertilizers">Cancel</a><button class="btn primary">Save product</button></div></form>{% endblock %}

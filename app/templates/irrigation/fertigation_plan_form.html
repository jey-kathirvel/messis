{% extends "irrigation/layout.html" %}{% block irrigation_content %}<section class="scheduler-head"><div><span class="eyebrow green">SAFE RECIPE BUILDER</span><h2>Create fertigation plan</h2><p>Define water, batches, flushing, injection timing and field responsibility.</p></div><a class="btn" href="/irrigation/fertigation">← Dashboard</a></section><form class="form-card" method="post"><div class="form-grid"><label>Farm<select name="farm_id" required><option value="">Select farm</option>{% for farm in farms %}<option value="{{ farm.id }}" {% if selected_schedule and selected_schedule.farm_id==farm.id %}selected{% endif %}>{{ farm.name }}</option>{% endfor %}</select></label><label>Zone<select name="zone_id" required><option value="">Select zone</option>{% for zone in zones %}<option value="{{ zone.id }}" {% if selected_schedule and selected_schedule.zone_id==zone.id %}selected{% endif %}>{{ zone.name }}</option>{% endfor %}</select></label><label>Linked irrigation schedule<select name="schedule_id"><option value="">Not linked</option>{% for schedule in schedules %}<option value="{{ schedule.id }}" {% if selected_schedule and selected_schedule.id==schedule.id %}selected{% endif %}>{{ schedule.scheduled_date }} · Schedule #{{ schedule.id }}</option>{% endfor %}</select></label><label>Plan name<input name="name" required placeholder="Example: Coconut NPK - August"></label><label>Planned date<input type="date" name="planned_date" value="{{ selected_schedule.scheduled_date if selected_schedule else today }}" required></label><label>Growth stage<input name="growth_stage"></label><label>Total water (L)<input type="number" min="1" step="0.01" name="total_water_litres" value="{{ selected_schedule.planned_litres if selected_schedule and selected_schedule.planned_litres else '' }}" required></label><label>Tank capacity (L)<input type="number" min="1" step="0.01" name="tank_capacity_litres" required></label><label>Initial flush (min)<input type="number" min="0" name="initial_flush_minutes"></label><label>Injection (min)<input type="number" min="0" name="injection_minutes"></label><label>Final flush (min)<input type="number" min="0" name="final_flush_minutes"></label><label>Assigned worker<input name="assigned_worker" value="{{ selected_schedule.assigned_worker if selected_schedule and selected_schedule.assigned_worker else '' }}"></label><label class="wide">Agronomist reference<input name="agronomist_reference"></label><label class="wide">Plan safety instructions<textarea name="safety_instructions"></textarea></label></div><div class="form-actions"><a class="btn" href="/irrigation/fertigation">Cancel</a><button class="btn primary">Create recipe</button></div></form>{% endblock %}

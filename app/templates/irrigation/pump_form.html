{% extends "irrigation/layout.html" %}{% block irrigation_content %}<section class="panel"><form method="post" class="form-grid"><label>Farm *<select name="farm_id" required>{% for f in farms %}<option value="{{ f.id }}" {% if (pump and pump.farm_id==f.id) or (not pump and selected_farm_id==f.id) %}selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></label><label>Water source<select name="water_source_id"><option value="">Not linked</option>{% for s in sources %}<option value="{{ s.id }}" {% if pump and pump.water_source_id==s.id %}selected{% endif %}>{{ s.name }}</option>{% endfor %}</select></label><label>Pump name *<input name="name" required value="{{ pump.name if pump else '' }}"></label><label>Pump type<select name="pump_type"><option value="">Select</option>{% for x in pump_types %}<option value="{{ x }}" {% if pump and pump.pump_type==x %}selected{% endif %}>{{ x|replace('_',' ')|title }}</option>{% endfor %}</select></label><label>Horsepower<input type="number" step="0.01" min="0" name="horsepower" value="{{ pump.horsepower if pump and pump.horsepower is not none else '' }}"></label><label>Flow rate LPM<input type="number" step="0.01" min="0" name="flow_rate_lpm" value="{{ pump.flow_rate_lpm if pump and pump.flow_rate_lpm is not none else '' }}"></label><label>Power source<select name="power_source"><option value="">Select</option>{% for x in power_sources %}<option value="{{ x }}" {% if pump and pump.power_source==x %}selected{% endif %}>{{ x|title }}</option>{% endfor %}</select></label><label>Operating cost/hour<input type="number" step="0.01" min="0" name="operating_cost_per_hour" value="{{ pump.operating_cost_per_hour if pump and pump.operating_cost_per_hour is not none else '' }}"></label><label>Installation date<input type="date" name="installation_date" value="{{ pump.installation_date if pump and pump.installation_date else '' }}"></label><label>Last service<input type="date" name="last_service_date" value="{{ pump.last_service_date if pump and pump.last_service_date else '' }}"></label><label>Next service<input type="date" name="next_service_date" value="{{ pump.next_service_date if pump and pump.next_service_date else '' }}"></label><label>Status<select name="status">{% for x in statuses %}<option value="{{ x }}" {% if pump and pump.status==x %}selected{% endif %}>{{ x|title }}</option>{% endfor %}</select></label><label class="wide">Fault details<textarea name="fault_details">{{ pump.fault_details if pump and pump.fault_details else '' }}</textarea></label><div class="wide form-actions"><a href="/irrigation/pumps">Cancel</a><button class="btn primary">Save pump</button></div></form></section>{% endblock %}

{% extends "irrigation/layout.html" %}{% block irrigation_content %}<section class="panel"><form method="post" class="form-grid"><label>Farm *<select name="farm_id" required>{% for f in farms %}<option value="{{ f.id }}" {% if selected_farm_id==f.id %}selected{% endif %}>{{ f.name }}</option>{% endfor %}</select></label><label>Zone<select name="zone_id"><option value="">Not linked</option>{% for z in zones %}<option value="{{ z.id }}">{{ z.name }}</option>{% endfor %}</select></label><label>Pump<select name="pump_id"><option value="">Not linked</option>{% for p in pumps %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}</select></label><label>Name *<input name="name" required></label><label>Equipment type<select name="equipment_type">{% for x in types %}<option value="{{ x }}">{{ x|replace('_',' ')|title }}</option>{% endfor %}</select></label><label>Manufacturer<input name="manufacturer"></label><label>Model number<input name="model_number"></label><label>Serial number<input name="serial_number"></label><label>Installation date<input type="date" name="installation_date"></label><label>Purchase cost<input type="number" step="0.01" min="0" name="purchase_cost"></label><label>Status<select name="status">{% for x in statuses %}<option value="{{ x }}">{{ x|replace('_',' ')|title }}</option>{% endfor %}</select></label><label>Last service<input type="date" name="last_service_date"></label><label>Next service<input type="date" name="next_service_date"></label><label class="wide">Notes<textarea name="notes"></textarea></label><label class="check"><input type="checkbox" name="is_active" checked> Active</label><div class="wide form-actions"><a href="/irrigation/equipment">Cancel</a><button class="btn primary">Save equipment</button></div></form></section>{% endblock %}

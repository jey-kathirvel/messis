<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ page_title }} · Messis AI</title>
<style>body{margin:0;font:16px system-ui;background:#f2f7f2;color:#17351f}main{max-width:760px;margin:auto;padding:28px 18px}.panel{background:white;border-radius:20px;padding:28px;box-shadow:0 10px 35px #16351f18}.brand{color:#147a37;font-weight:800}.type{display:inline-flex;gap:8px;padding:8px 12px;border-radius:99px;background:#edf9f0}label{display:block;font-weight:700;margin:18px 0}input,select{display:block;width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #b9c9bb;border-radius:9px;font:inherit}button,.button{display:inline-block;border:0;border-radius:10px;padding:12px 18px;font-weight:750;text-decoration:none;cursor:pointer}.primary{background:#147a37;color:white}.secondary{background:#e7eee8;color:#17351f}.actions{display:flex;gap:10px;margin-top:24px}.error{color:#b42318}.success{color:#147a37}</style></head>
<body><main><div class="panel"><div class="brand">MESSIS AI</div><p><span class="type">{{ farm_context.icon }} {{ farm_context.farm_type_name }}</span></p><h1>Configure {{ farm.name }}</h1><p>These fields are defined by the farm's published template.</p><div id="message"></div><form id="form">
{% for field in farm_context.dynamic_fields %}<label>{{ field.label }}{% if field.key in ['tree_count','cultivated_area','cattle_count','daily_capacity'] %}<input type="number" step="any" name="{{ field.key }}" value="{{ field.value if field.value is not none else '' }}">{% else %}<input type="text" name="{{ field.key }}" value="{{ field.value if field.value is not none else '' }}">{% endif %}</label>{% endfor %}
<div class="actions"><a class="button secondary" href="/farms/{{ farm.id }}">Cancel</a><button class="primary">Save configuration</button></div></form></div></main>
<script>document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const values=Object.fromEntries(new FormData(e.target));const r=await fetch('/api/v1/farms/{{ farm.id }}/dynamic-fields',{method:'PUT',headers:{'Content-Type':'application/json','X-Messis-CSRF':'1'},body:JSON.stringify({values})});const out=await r.json();const m=document.querySelector('#message');if(!r.ok){m.className='error';m.textContent=Object.values(out.errors||{}).join(' · ')||'Unable to save'}else{m.className='success';m.textContent='Configuration saved';setTimeout(()=>location.href='/farms/{{ farm.id }}',500)}};</script></body></html>

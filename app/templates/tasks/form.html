{% extends "base.html" %}{% block content %}<link rel="stylesheet" href="/static/css/tasks.css?v=001"><main class="task-shell task-form-wrap"><section class="task-hero"><div><h1>🌾 Create Farm Task</h1><p>Add the work first. Worker assignment happens on the next screen.</p></div></section><form class="task-form-card" method="post" action="/tasks/new" style="margin-top:18px"><div class="task-form-grid"><div class="task-field task-span-2"><label for="farm_id">Farm *</label><select id="farm_id" name="farm_id" required><option value="">Select farm</option>{% for farm in farms %}<option value="{{ farm.id }}" {% if selected_farm_id==farm.id %}selected{% endif %}>{{ farm.name }}{% if farm.location %} · {{ farm.location }}{% endif %}</option>{% endfor %}</select><small class="task-help">The task will be visible under this farm.</small></div><div class="task-field task-span-2"><label for="title">Task title *</label><input id="title" name="title" maxlength="180" required placeholder="Example: Apply fertilizer to Block A"></div><div class="task-field task-span-2"><label for="description">Work details</label><textarea id="description" name="description" placeholder="Explain what must be done, location or materials needed"></textarea></div><div class="task-field"><label for="priority">Priority</label><select id="priority" name="priority"><option>LOW</option><option selected>MEDIUM</option><option>HIGH</option><option>URGENT</option></select></div><div class="task-field"><label for="due_date">Due date</label><input id="due_date" name="due_date" type="date"></div></div><div class="task-form-actions"><a class="task-btn task-btn-soft" href="/tasks">Cancel</a><button class="task-btn task-btn-primary" type="submit">Create as New →</button></div></form></main>{% endblock %}

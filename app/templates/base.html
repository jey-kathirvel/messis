<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#073b2a">
    <meta name="description" content="Messis AI smart agriculture management system">
    <title>{{ page_title }} | Messis AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">

    <!-- PATCH-UI-SUBPAGES-001A -->
    <link
        rel="stylesheet"
        href="/static/css/messis-subpages.css?v=001a"
    >

</head>
<body class="messis-modern-subpage">

<!-- PATCH-UI-SUBPAGES-001A-TOOLBAR -->
<header class="messis-page-toolbar">
    <div class="messis-page-toolbar-left">
        <a
            class="messis-page-brand"
            href="/dashboard"
            aria-label="Messis AI Dashboard"
        >
            <span class="messis-page-brand-icon">🌴</span>

            <span class="messis-page-brand-copy">
                <strong>Messis AI</strong>
                <span>Smart Agriculture Management System</span>
            </span>
        </a>
    </div>

    <div class="messis-page-toolbar-right">
        <button
            class="messis-nav-button"
            type="button"
            onclick="messisGoBack()"
        >
            <span aria-hidden="true">←</span>
            <span>Back</span>
        </button>

        <a
            class="messis-nav-button messis-nav-button-primary"
            href="/dashboard"
        >
            <span aria-hidden="true">⌂</span>
            <span>Back to Dashboard</span>
        </a>
    </div>
</header>


    {% block content %}{% endblock %}
    <script src="{{ url_for('static', path='js/app.js') }}"></script>

<script>
    function messisGoBack() {
        const sameSiteReferrer =
            document.referrer
            && new URL(document.referrer).origin
                === window.location.origin;

        if (sameSiteReferrer && window.history.length > 1) {
            window.history.back();
            return;
        }

        window.location.href = "/dashboard";
    }
</script>

</body>
</html>

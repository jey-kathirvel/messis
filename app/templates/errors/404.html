<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Page Not Found · Messis AI</title>
    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.ico"
    >
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            color: #14532d;
            background: #f0fdf4;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(560px, 100%);
            background: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(20, 83, 45, 0.12);
            text-align: center;
        }

        .code {
            font-size: 72px;
            line-height: 1;
            font-weight: 800;
            color: #16a34a;
        }

        h1 {
            margin: 18px 0 10px;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 20px;
            border-radius: 999px;
            text-decoration: none;
            color: #ffffff;
            background: #15803d;
            font-weight: 700;
        }
    </style>
    <link rel="stylesheet" href="/static/css/garden-glass.css?v=003">

    <!-- PATCH-PWA-001A-METADATA -->
    <link
        rel="manifest"
        href="/static/pwa/manifest.webmanifest"
    >

    <meta
        name="theme-color"
        content="#064e3b"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Messis AI"
    >

    <link
        rel="apple-touch-icon"
        href="/static/pwa/icon-192.png"
    >

</head>
<body>
<main>
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>
        The requested Messis AI page does not exist or is no longer available.
    </p>
    <a href="/">Return to Messis AI</a>
</main>

<!-- PATCH-PWA-001A-REGISTRATION -->
<script>
    (() => {
        if (!("serviceWorker" in navigator)) {
            return;
        }

        window.addEventListener(
            "load",
            async () => {
                try {
                    const registration =
                        await navigator
                            .serviceWorker
                            .register(
                                "/service-worker.js",
                                {
                                    scope: "/"
                                }
                            );

                    registration.addEventListener(
                        "updatefound",
                        () => {
                            const worker =
                                registration.installing;

                            if (!worker) {
                                return;
                            }

                            worker.addEventListener(
                                "statechange",
                                () => {
                                    if (
                                        worker.state
                                            === "installed"
                                        && navigator
                                            .serviceWorker
                                            .controller
                                    ) {
                                        window.dispatchEvent(
                                            new CustomEvent(
                                                "messis:pwa-update"
                                            )
                                        );
                                    }
                                }
                            );
                        }
                    );
                } catch (error) {
                    console.warn(
                        "Messis PWA registration:",
                        error
                    );
                }
            }
        );
    })();
</script>

</body>
</html>

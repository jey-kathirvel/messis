<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Service Error · Messis AI</title>
    <link
        rel="icon"
        type="image/svg+xml"
        href="/favicon.ico"
    >
    <style>
        :root {
            font-family: Inter, ui-sans-serif, system-ui, sans-serif;
            color: #14532d;
            background: #f0fdf4;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            box-sizing: border-box;
        }

        main {
            width: min(560px, 100%);
            background: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(20, 83, 45, 0.12);
            text-align: center;
        }

        .code {
            font-size: 72px;
            line-height: 1;
            font-weight: 800;
            color: #dc2626;
        }

        h1 {
            margin: 18px 0 10px;
        }

        p {
            color: #4b5563;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 20px;
            border-radius: 999px;
            text-decoration: none;
            color: #ffffff;
            background: #15803d;
            font-weight: 700;
        }
    </style>
</head>
<body>
<main>
    <div class="code">500</div>
    <h1>Something went wrong</h1>
    <p>
        Messis AI could not complete this request. Please try again.
    </p>
    <a href="/">Return to Messis AI</a>
</main>
</body>
</html>

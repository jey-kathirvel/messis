<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#064e3b"
    >

    <title>Offline · Messis AI</title>

    <style>
        :root {
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
            padding: 20px;

            color: #0f172a;

            background:
                radial-gradient(
                    circle at 90% 10%,
                    rgba(16, 185, 129, 0.18),
                    transparent 30%
                ),
                #f4faf6;
        }

        main {
            width: min(480px, 100%);
            padding: 34px;

            background: white;
            border: 1px solid #d1fae5;
            border-radius: 24px;
            box-shadow:
                0
                20px
                55px
                rgba(15, 23, 42, 0.10);

            text-align: center;
        }

        .icon {
            display: grid;
            width: 82px;
            height: 82px;
            margin: 0 auto 20px;
            place-items: center;

            color: white;
            background:
                linear-gradient(
                    135deg,
                    #064e3b,
                    #10b981
                );

            border-radius: 24px;
            font-size: 39px;
        }

        h1 {
            margin: 0;
            color: #064e3b;
            font-size: 28px;
        }

        p {
            margin: 13px 0 0;
            color: #64748b;
            line-height: 1.65;
        }

        button {
            min-height: 44px;
            margin-top: 22px;
            padding: 10px 18px;

            color: white;
            background:
                linear-gradient(
                    135deg,
                    #047857,
                    #10b981
                );

            border: 0;
            border-radius: 12px;

            font-weight: 850;
            cursor: pointer;
        }
    </style>
</head>

<body>
<main>
    <div class="icon">🌴</div>

    <h1>Messis AI is offline</h1>

    <p>
        The internet connection is currently unavailable.
        Previously cached application assets remain available,
        but live farm records require a connection.
    </p>

    <button
        type="button"
        onclick="window.location.reload()"
    >
        ↻ Try Again
    </button>
</main>
</body>
</html>
